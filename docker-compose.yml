services:
  bloem-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloem-dev
    restart: unless-stopped
    ports:
      - "8124:8080"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

