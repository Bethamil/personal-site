services:
  personal-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-site
    restart: unless-stopped
    ports:
      - "8124:8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


